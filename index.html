// ----- FadingVideo -----
function FadingVideo({ src, className, style }) {
  const ref = useRef(null);
  const rafRef = useRef(null);
  const fadingOutRef = useRef(false);
  const FADE_MS = 500;
  const FADE_OUT_LEAD = 0.55;

  useEffect(() => {
    const v = ref.current;
    if (!v) return;
    v.style.opacity = "0";

    const fadeTo = (target, duration = FADE_MS) => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      const start = performance.now();
      const from = parseFloat(v.style.opacity || "0");
      const step = (now) => {
        const t = Math.min(1, (now - start) / duration);
        v.style.opacity = String(from + (target - from) * t);
        if (t < 1) rafRef.current = requestAnimationFrame(step);
      };
      rafRef.current = requestAnimationFrame(step);
    };

    const onLoaded = () => {
      v.style.opacity = "0";
      v.play().catch(() => {});
      fadeTo(1);
    };
    const onTimeUpdate = () => {
      if (!fadingOutRef.current && v.duration && v.duration - v.currentTime <= FADE_OUT_LEAD && v.duration - v.currentTime > 0) {
        fadingOutRef.current = true;
        fadeTo(0);
      }
    };
    const onEnded = () => {
      v.style.opacity = "0";
      setTimeout(() => {
        v.currentTime = 0;
        v.play().catch(() => {});
        fadingOutRef.current = false;
        fadeTo(1);
      }, 100);
    };

    v.addEventListener("loadeddata", onLoaded);
    v.addEventListener("timeupdate", onTimeUpdate);
    v.addEventListener("ended", onEnded);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      v.removeEventListener("loadeddata", onLoaded);
      v.removeEventListener("timeupdate", onTimeUpdate);
      v.removeEventListener("ended", onEnded);
    };
  }, [src]);

  return (
    <video
      ref={ref}
      src={src}
      autoPlay
      muted
      playsInline
      preload="auto"
      className={className}
      style={{ opacity: 0, ...style }} />);


}

// ----- BlurText -----
function BlurText({ text, className = "", delay = 0 }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {if (e.isIntersecting) setInView(true);});
    }, { threshold: 0.1 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const words = text.split(" ");
  return (
    <p ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}>
      {words.map((w, i) =>
      <motion.span
        key={i}
        initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
        animate={inView ? { filter: ["blur(10px)", "blur(5px)", "blur(0px)"], opacity: [0, 0.5, 1], y: [50, -5, 0] } : {}}
        transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: delay + i * 100 / 1000 }}
        style={{ display: "inline-block", marginRight: "0.28em" }}>
        
          {w}
        </motion.span>
      )}
    </p>);

}

// ----- Password Gate -----
function PasswordGate({ onUnlock }) {
  const [val, setVal] = useState("");
  const [err, setErr] = useState(false);
  const [shake, setShake] = useState(0);
  const PASSCODE = "SCLFvnxO";

  const submit = (e) => {
    e.preventDefault();
    if (val.trim() === PASSCODE) {
      onUnlock();
    } else {
      setErr(true);
      setShake((n) => n + 1);
      setTimeout(() => setErr(false), 1800);
    }
  };

  return (
    <motion.div
      initial={{ opacity: 1 }}
      exit={{ opacity: 0, filter: "blur(20px)" }}
      transition={{ duration: 0.8, ease: "easeInOut" }}
      className="fixed inset-0 z-[100] bg-black overflow-hidden">
      
      <FadingVideo
        src="https://cdn.pixabay.com/video/2024/02/12/200078-913125908_large.mp4"
        className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 object-cover z-0"
        style={{ width: "120%", height: "120%", filter: "blur(8px) brightness(0.5)" }} />
      
      <div className="absolute inset-0 z-[1] bg-black/40" />

      <div className="relative z-10 min-h-screen flex flex-col items-center justify-center px-6">
        <motion.div
          initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
          animate={{ filter: "blur(0px)", opacity: 1, y: 0 }}
          transition={{ duration: 0.9, delay: 0.1, ease: "easeOut" }}
          className="liquid-glass rounded-full px-3.5 py-1 text-xs font-medium text-white mb-8 inline-flex items-center gap-2">
          
          <span className="bg-white text-black rounded-full px-2 py-0.5 text-[10px] font-semibold tracking-wider">PRIVATE</span>
          <span className="pr-2">Invitation-only forum · Stockholm 2026</span>
        </motion.div>

        <motion.div
          initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
          animate={{ filter: "blur(0px)", opacity: 1, y: 0 }}
          transition={{ duration: 1.0, delay: 0.3, ease: "easeOut" }}
          className="text-center">
          
          <h1 className="font-heading italic text-white text-[2.75rem] sm:text-5xl md:text-6xl lg:text-7xl leading-[0.9] md:leading-[0.85] tracking-[-2px] md:tracking-[-3px] max-w-3xl">
            Stockholm Climate<br />Leadership Forum
          </h1>
          <p className="mt-5 text-sm md:text-base text-white/80 font-body font-light max-w-md mx-auto leading-snug">
            Enter your invitation passcode to access registration for the SCLF 2026 Forum.
          </p>
        </motion.div>

        <motion.form
          onSubmit={submit}
          key={shake}
          initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
          animate={
          err ?
          { filter: "blur(0px)", opacity: 1, x: [0, -10, 10, -8, 8, -4, 4, 0] } :
          { filter: "blur(0px)", opacity: 1, y: 0 }
          }
          transition={{ duration: err ? 0.5 : 1.0, delay: err ? 0 : 0.55, ease: "easeOut" }}
          className="mt-10 w-full max-w-md">
          
          <div className="liquid-glass-strong rounded-full pl-5 pr-1.5 py-1.5 flex items-center gap-3">
            <LockIcon className="h-4 w-4 text-white/70 shrink-0" />
            <input
              type="password"
              autoFocus
              value={val}
              onChange={(e) => setVal(e.target.value)}
              placeholder="Enter passcode"
              className="pwd-input flex-1 bg-transparent text-white text-sm font-body font-medium placeholder:tracking-normal placeholder:font-light" />
            
            <button
              type="submit"
              className="bg-white text-black rounded-full px-5 py-2.5 text-sm font-medium font-body inline-flex items-center gap-1.5 hover:bg-white/90 transition-colors">
              
              Unlock <ArrowUpRight className="h-4 w-4" />

          <div className="h-5 mt-3 text-center">
            <AnimatePresence>

                className="text-xs font-body text-white/80">

        <motion.div

const HERO_VIDEO_URL = "hero.mp4";
const HERO_VIDEO_FALLBACK = "https://cdn.pixabay.com/video/2024/02/12/200078-913125908_large.mp4";

function Hero() {
  const videoRef = useRef(null);
  const [loadPct, setLoadPct] = useState(0);
  const [ready, setReady] = useState(false);
  const [loadingHidden, setLoadingHidden] = useState(false);

  // Hide loading overlay after a brief hold once ready (smooth fade)
  useEffect(() => {
    if (ready) {
      const t = setTimeout(() => setLoadingHidden(true), 600);
      return () => clearTimeout(t);
    }
  }, [ready]);

  // Lock body scroll while loading
  useEffect(() => {
    if (!loadingHidden) {
      const prev = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      document.body.classList.add("hero-loading");
      return () => {
        document.body.style.overflow = prev;
        document.body.classList.remove("hero-loading");
      };
    }
  }, [loadingHidden]);

  // Ambient looping hero video. Frame-accurate scroll-scrubbing needs a clip
  // encoded with dense keyframes; this source isn't, so seeking crawled then
  // snapped to the end on the live server. A muted autoplay loop streams and
  // Hero video: play through once on load, then hold on the last frame. No
  // scroll-scrubbing (the source isn't keyframe-dense enough to seek) and no
  // loop — it streams and plays smoothly everywhere (Vercel + mobile).
  useEffect(() => {
    const v = videoRef.current;
    if (!v) return;

    v.muted = true;
    v.playsInline = true;
    v.loop = false;
    v.preload = "auto";

    const onLoaded = () => { v.playbackRate = 1.25; v.play().catch(() => {}); setReady(true); };
    const onProgress = () => {
      try {
        const d = v.duration;
        if (v.buffered.length && d && isFinite(d)) {
          setLoadPct(Math.min(100, Math.round(v.buffered.end(v.buffered.length - 1) / d * 100)));
        }
      } catch (e) {}
    };
    const onError = () => {
      const s = v.getAttribute("src") || "";
      if (s.indexOf(HERO_VIDEO_FALLBACK) === -1) {
        v.src = HERO_VIDEO_FALLBACK;
        v.load();
        v.playbackRate = 1.25;
        v.play().catch(() => {});
      }
    };

    v.addEventListener("loadeddata", onLoaded, { once: true });
    v.addEventListener("progress", onProgress);
    v.addEventListener("canplaythrough", () => setLoadPct(100));
    v.addEventListener("error", onError);

    // Failsafe: never trap the user on the loader if the video is slow/blocked.
    const failsafe = setTimeout(() => setReady(true), 6000);

    v.load();

    return () => {
      clearTimeout(failsafe);
      v.removeEventListener("progress", onProgress);
      v.removeEventListener("error", onError);
    };
  }, []);

  return (
    <section id="hero" className="relative h-screen overflow-hidden">
      <div className="absolute inset-0">
        <div className="absolute inset-0">
          <video
            ref={videoRef}
            src="hero.mp4"
            className="absolute inset-0 w-full h-full object-cover z-0"
            style={{ background: "#0a1410" }}
            autoPlay
            muted
            playsInline
            preload="auto" />
          

          {/* Loading overlay — shows while frames are extracting */}
          {!loadingHidden &&
          <div
            className="absolute inset-0 z-[60] flex flex-col items-center justify-center pointer-events-auto"
            style={{
              background: "#0a1410",
              opacity: ready ? 0 : 1,
              transition: "opacity 0.6s ease-out"
            }}>
            
              <div className="flex flex-col items-center gap-8 max-w-sm px-6">
                {/* Brand mark */}
                <image-slot
                id="brand-logo-loader"
                class="logo-slot"
                src="logo-loader.webp"
                placeholder="Drop logo"
                shape="rect"
                style={{ display: "block", height: "110px", width: "180px" }}>
              </image-slot>

                {/* Progress bar */}
                <div className="w-64 h-[2px] bg-white/10 rounded-full overflow-hidden">
                  <div
                  className="h-full bg-white rounded-full"
                  style={{
                    width: `${loadPct}%`,
                    transition: "width 0.2s ease-out"
                  }} />
                
                </div>

                {/* Status copy */}
                <div className="text-center space-y-1.5">
                  <div className="text-white/80 text-xs uppercase tracking-[0.2em] font-body">
                    Preparing the venue
                  </div>
                  <div className="text-white/40 text-[11px] font-mono tabular-nums">
                    {loadPct > 0 ? `${loadPct}%` : "Initializing\u2026"}
                  </div>
                </div>
              </div>
            </div>
          }
          <div className="absolute inset-0 z-[1]" style={{
            background: "linear-gradient(180deg, rgba(8,16,12,0.45) 0%, rgba(8,16,12,0.15) 30%, rgba(8,16,12,0.25) 70%, rgba(8,16,12,0.9) 100%)"
          }} />

          <div
            className="absolute inset-0 z-10 flex flex-col items-center justify-start pt-24 md:pt-32 px-5 md:px-4">
            
        <motion.div
              initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
              animate={{ filter: "blur(0px)", opacity: 1, y: 0 }}
              transition={{ duration: 0.9, delay: 0.4, ease: "easeOut" }}
              className="liquid-glass rounded-full px-1 py-1 inline-flex items-center gap-2 max-w-full">
              
          <span className="bg-white text-black rounded-full px-3 py-1 text-xs font-semibold shrink-0">2026</span>

        <div className="mt-6 max-w-3xl">
          <BlurText

                className="text-[2.5rem] sm:text-6xl md:text-7xl lg:text-[5.5rem] font-heading italic text-white leading-[0.85] md:leading-[0.8] max-w-3xl tracking-[-2px] md:tracking-[-4px]"

  return v.replace(/\D/g, "").slice(0, 16).replace(/(\d{4})(?=\d)/g, "$1 ");

function formatExp(v) {

        background: "radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 50%), radial-gradient(ellipse at 10% 80%, rgba(255,255,255,0.04) 0%, transparent 50%)"
      }} />
      <div className="relative z-10 max-w-5xl mx-auto">
        <p className="text-sm font-body text-white/80 mb-5 md:mb-6">// Confirm & Pay</p>
        <h2 className="font-heading italic text-white text-[2.75rem] sm:text-5xl md:text-6xl lg:text-[5rem] leading-[0.95] md:leading-[0.9] tracking-[-1.5px] md:tracking-[-2.5px] max-w-3xl">
          Complete your<br />registration
        </h2>
        <p className="mt-5 md:mt-6 text-sm md:text-base text-white/80 font-body font-light max-w-xl leading-snug">
          Confirm your selection below. We'll hand you off to Stripe for secure checkout — your delegate details and billing are collected there.
        </p>

        <div className="grid grid-cols-1 lg:grid-cols-5 gap-6 mt-10 md:mt-14">
          {/* Selected pass + checkout */}
          <div className="lg:col-span-3 liquid-glass-strong rounded-[1.5rem] p-6 sm:p-7 md:p-10 flex flex-col">
            <p className="text-[11px] uppercase tracking-[0.2em] text-white/55 font-body mb-5">Your selection</p>

            <div className="flex items-start justify-between gap-4">
              <div>
                <h3 className="font-heading italic text-white text-3xl sm:text-4xl md:text-5xl tracking-[-1.5px] leading-none">{tier.name}</h3>
                <p className="mt-4 text-sm text-white/80 font-body font-light leading-snug max-w-md">{tier.blurb}</p>
              </div>
              <div className="text-right shrink-0">
                <div className="font-heading italic text-white text-3xl sm:text-4xl md:text-5xl tracking-[-1.5px] leading-none whitespace-nowrap">€{tier.price.toLocaleString("en-IE")}</div>
                <div className="text-[11px] text-white/55 font-body mt-2">incl. VAT</div>
              </div>
            </div>

            <div className="h-px bg-white/15 my-7" />

            <p className="text-[11px] uppercase tracking-[0.2em] text-white/55 font-body mb-4">What's included</p>
            <ul className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2.5 text-sm font-body font-light text-white/90">
              {tier.perks.map((p) =>
              <li key={p} className="flex items-start gap-2.5">
                  <CheckIcon className="h-3.5 w-3.5 text-white/80 mt-1 shrink-0" />
                  <span>{p}</span>
                </li>
              )}
            </ul>

            <div className="flex-1 min-h-8" />

            <button
              type="button"
              onClick={goToStripe}
              className="mt-8 bg-white text-black rounded-full w-full px-7 py-4 text-sm font-medium font-body inline-flex items-center justify-center gap-2 hover:bg-white/90 transition-colors">
              
              <LockIcon className="h-4 w-4" />
              <span>Pay €{tier.price.toLocaleString("en-IE")} with Stripe</span>
              <ArrowUpRight className="h-5 w-5" />
            </button>

            <p className="mt-4 text-[11px] text-white/55 font-body font-light leading-snug text-center">
              You'll be redirected to Stripe Checkout to enter your details and complete payment securely. Refundable up to 30 days before the Forum opens.
            </p>
          </div>

          {/* Switch tier */}
          <aside className="lg:col-span-2 liquid-glass rounded-[1.5rem] p-7 md:p-8 h-fit">
            <p className="text-[11px] uppercase tracking-[0.2em] text-white/55 font-body mb-5">Change pass</p>

            <div className="space-y-3">
              {TIERS.map((t) => {
                const locked = t.gated && !dinnerUnlocked;
                return (
                <button
                  key={t.id}
                  type="button"
                  disabled={locked}
                  onClick={() => !locked && setSelected(t.id)}
                  className={`w-full text-left rounded-[14px] px-4 py-3.5 flex items-center justify-between border transition-colors ${selected === t.id ? "border-white/50 bg-white/[0.06]" : "border-white/10 bg-white/[0.02] hover:bg-white/[0.04]"} ${locked ? "opacity-55 cursor-default hover:bg-white/[0.02]" : ""}`}>
                  
                  <div className="flex items-center gap-3 min-w-0">
                    {locked ?
                    <LockIcon className="h-4 w-4 text-white/50 shrink-0" /> :
                    <div className={`w-4 h-4 rounded-full border ${selected === t.id ? "bg-white border-white" : "border-white/40"} flex items-center justify-center shrink-0`}>
                      {selected === t.id && <div className="w-1.5 h-1.5 rounded-full bg-black" />}
                    </div>
                    }
                    <div className="min-w-0">
                      <div className="font-heading italic text-white text-lg leading-tight truncate">{t.short || t.name}</div>
                      <div className="text-[11px] text-white/55 font-body mt-0.5 whitespace-nowrap">{locked ? "Locked · code required" : "SCLF 2026 · 3 October"}</div>
                    </div>
                  </div>
                  <div className="text-sm font-body font-medium text-white whitespace-nowrap pl-3">€{t.price.toLocaleString("en-IE")}</div>
                </button>);
              })}
            </div>

            <div className="mt-6 liquid-glass rounded-[12px] p-4 flex items-start gap-3">
              <LockIcon className="h-4 w-4 text-white/70 mt-0.5 shrink-0" />
              <p className="text-[11px] text-white/65 font-body font-light leading-snug">
                Payment is processed via Stripe. Card details are tokenised and never touch our servers.
              </p>
            </div>
          </aside>
        </div>
      </div>
    </section>);

}

// ----- Confirmation -----
function Confirmation({ form, tier }) {
  const ref = useRef("SCLF-" + Math.random().toString(36).slice(2, 8).toUpperCase());
  return (
    <div className="fixed inset-0 z-[90] bg-black overflow-y-auto">
      <FadingVideo
        src="https://cdn.pixabay.com/video/2024/02/12/200078-913125908_large.mp4"
        className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 object-cover z-0"
        style={{ width: "120%", height: "120%", filter: "blur(2px) brightness(0.55)" }} />
      
      <div className="absolute inset-0 z-[1] bg-black/50" />
      <div className="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-24">
        <motion.div
          initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
          animate={{ filter: "blur(0px)", opacity: 1, y: 0 }}
          transition={{ duration: 0.9, delay: 0.2, ease: "easeOut" }}
          className="liquid-glass rounded-full px-3.5 py-1 text-xs font-medium text-white inline-flex items-center gap-2 mb-8">
          
          <span className="bg-white text-black rounded-full px-2 py-0.5 text-[10px] font-semibold tracking-wider">CONFIRMED</span>
          Booking reference {ref.current}
        </motion.div>

        <motion.h2
          initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
          animate={{ filter: "blur(0px)", opacity: 1, y: 0 }}
          transition={{ duration: 1.0, delay: 0.4, ease: "easeOut" }}
          className="font-heading italic text-white text-5xl md:text-6xl lg:text-7xl leading-[0.85] tracking-[-3px] text-center max-w-3xl">
          
          Welcome to the<br />2026 Forum, {form.fName || "friend"}.
        </motion.h2>

        <motion.p
          initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
          animate={{ filter: "blur(0px)", opacity: 1, y: 0 }}
          transition={{ duration: 1.0, delay: 0.6, ease: "easeOut" }}
          className="mt-6 text-sm md:text-base text-white/85 font-body font-light max-w-xl text-center leading-snug">
          
          We've sent your itinerary, Code of Conduct and concierge contact to <span className="text-white">{form.email}</span>. A member of the Forum team will be in touch within 48 hours to coordinate logistics.
        </motion.p>

        <motion.div
          initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
          animate={{ filter: "blur(0px)", opacity: 1, y: 0 }}
          transition={{ duration: 1.0, delay: 0.8, ease: "easeOut" }}
          className="mt-10 grid grid-cols-1 md:grid-cols-3 gap-4 max-w-3xl w-full">
          
          {[
          { k: "Pass", v: tier.name },
          { k: "Dates", v: "3 October 2026" },
          { k: "Venue", v: "Stockholm City Hall" }].
          map((it) =>
          <div key={it.k} className="liquid-glass rounded-[1.25rem] p-5">
              <div className="text-[11px] uppercase tracking-[0.2em] text-white/55 font-body">{it.k}</div>
              <div className="font-heading italic text-white text-2xl tracking-[-1px] mt-2">{it.v}</div>
            </div>
          )}
        </motion.div>
      </div>
    </div>);

}

// ----- App -----
const DINNER_CODE = "DINNERMX1A";

function App() {
  const [unlocked, setUnlocked] = useState(false);
  const [selected, setSelected] = useState("forum");
  const [dinnerUnlocked, setDinnerUnlocked] = useState(false);

  const jump = (id) => {
    const el = document.getElementById(id);
    if (el) window.scrollTo({ top: el.offsetTop - 24, behavior: "smooth" });
  };

  const unlockDinner = (code) => {
    if (code.trim().toUpperCase() === DINNER_CODE) {
      setDinnerUnlocked(true);
      return true;
    }
    return false;
  };

  if (!unlocked) {
    return (
      <AnimatePresence>
        <PasswordGate key="gate" onUnlock={() => setUnlocked(true)} />
      </AnimatePresence>);

  }

  return (
    <div className="relative text-white">
      <Navbar onJump={jump} />
      <Hero />
      <Pillars />
      <Tickets selected={selected} setSelected={setSelected} onContinue={() => jump("payment")} dinnerUnlocked={dinnerUnlocked} onUnlockDinner={unlockDinner} />
      <Payment selected={selected} setSelected={setSelected} dinnerUnlocked={dinnerUnlocked} />
      <footer className="relative py-12 md:py-16 px-5 sm:px-8 md:px-16 lg:px-20 border-t border-white/10">
        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-start md:items-end justify-between gap-8">
          <div>
            <div className="mb-6">
              <image-slot
                id="brand-logo-footer"
                class="logo-slot"
                src="logo-footer.webp"
                placeholder="Drop logo"
                shape="rect"
                style={{ width: "150px", display: "block", height: "65px" }}>
              </image-slot>
            </div>
            <p className="text-xs text-white/50 font-body mt-4 max-w-md">A trusted think tank and private gathering of the Nordic region's most influential leaders. Founded 2023.</p>
          </div>
          <div className="text-xs text-white/40 font-body">
            © 2026 SCLF · Stockholm · info@sclf.se
          </div>
        </div>
      </footer>
    </div>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
